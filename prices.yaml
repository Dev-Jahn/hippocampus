# API list prices, USD per 1M tokens. PRIORS uses this to turn recorded usage into
# dollars; a model absent here shows up as "unpriced" (named, never guessed).
#
# Refresh at every release: check the vendor pricing pages, update the numbers, and
# bump `as_of` — PRIORS prints it, so a stale sheet is visible instead of silently
# wrong. Sources: https://developers.openai.com/api/docs/pricing ,
# https://platform.claude.com/docs/en/about-claude/pricing
as_of: "2026-09-23"
models:
  # OpenAI GPT-6, standard tier, short context (the page prices long context at 2x, batch at
  # 0.5x, and the fast tier separately). gpt-6-sol/luna retired from the sheet 2026-09-23;
  # gpt-5.6-terra is no longer on the vendor page at all, so it is unpriced rather than guessed.
  gpt-6-astra: {input: 10.00, cached: 1.00, output: 50.00}
  gpt-6-sol:   {input: 2.00, cached: 0.20, output: 10.00}
  gpt-6-luna:  {input: 0.10, cached: 0.01, output: 0.50}
  # Anthropic (cached = cache-read rate: 0.1x input; 0.025x on Fable 5.1, 0.05x on Opus 5.5).
  # Fable 5, Opus 5 and Opus 4.8 retired from the sheet 2026-09-23.
  claude-fable-5-1: {input: 10.00, cached: 0.25, output: 50.00}
  claude-opus-5-5:  {input: 4.00, cached: 0.20, output: 20.00}
  # Sonnet 5 launch pricing became the standard price; the 2026-09-01 increase was cancelled.
  claude-sonnet-5:  {input: 2.00, cached: 0.20, output: 10.00}
  claude-haiku-4-5: {input: 1.00, cached: 0.10, output: 5.00}
